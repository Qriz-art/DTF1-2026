<!DOCTYPE html>
<html lang="id" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> Memories XI | Angkatan 2026</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600;800&family=Cormorant+Garamond:italic,wght@600&display=swap" rel="stylesheet">
    <style>
        body { 
            font-family: 'Plus Jakarta Sans', sans-serif; 
            background-color: #050505; 
            color: #f4f4f4;
            overflow-x: hidden;
        }

        /* Responsive Grid: 2 kolom (HP), 3 kolom (Tab), 4+ kolom (Web) */
        .album-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
            padding: 1rem;
        }

        @media (min-width: 640px) {
            .album-grid { grid-template-columns: repeat(3, 1fr); gap: 16px; }
        }

        @media (min-width: 1024px) {
            .album-grid { grid-template-columns: repeat(4, 1fr); gap: 24px; padding: 2rem; }
        }

        .photo-card {
            position: relative;
            aspect-ratio: 1 / 1;
            border-radius: 12px;
            overflow: hidden;
            background: #1a1a1a;
            transition: all 0.5s cubic-bezier(0.23, 1, 0.32, 1);
            cursor: pointer;
        }

        .photo-card img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            filter: grayscale(20%) brightness(90%);
            transition: all 0.6s ease;
        }

        .photo-card:hover { transform: scale(0.97); }
        .photo-card:hover img { filter: grayscale(0%) brightness(110%); transform: scale(1.1); }

        /* Lightbox Fix */
        #lightbox { background-color: rgba(0, 0, 0, 0.98); }

        .nav-btn {
            background: rgba(251, 191, 36, 0.1);
            color: #fbbf24;
            width: 45px;
            height: 45px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s ease;
            border: 1px solid rgba(251, 191, 36, 0.2);
            backdrop-filter: blur(5px);
        }

        .section-title { font-family: 'Cormorant Garamond', serif; }
        
        /* Custom Scrollbar */
        ::-webkit-scrollbar { width: 4px; }
        ::-webkit-scrollbar-thumb { background: #fbbf24; border-radius: 10px; }
    </style>
</head>
<body class="antialiased">

    <header class="pt-16 pb-10 px-6 relative overflow-hidden">
        <div class="absolute top-0 left-1/2 -translate-x-1/2 w-full h-64 bg-amber-500/10 blur-[100px] -z-10"></div>

        <div class="container mx-auto text-center">
            <div class="flex justify-center mb-8">
                <a href="index.html" class="group flex items-center gap-3 bg-white/5 border border-white/10 px-5 py-2 rounded-full hover:border-amber-500/50 transition-all">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4 text-amber-500" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7" />
                    </svg>
                    <span class="text-[10px] font-bold text-white uppercase tracking-[0.2em]">Kembali</span>
                </a>
            </div>

            <h1 class="text-5xl md:text-8xl font-black tracking-tighter leading-none mb-2">
                MEMORIES
            </h1>
            <h2 class="section-title text-3xl md:text-5xl italic text-amber-500 uppercase tracking-widest mb-6">
                2024 - 2025
            </h2>
            
            <div class="h-[1px] w-16 bg-amber-500/50 mx-auto mb-4"></div>
            <p class="text-slate-500 tracking-[0.3em] uppercase text-[9px] md:text-xs font-bold">Class XI • Desain Teknik Furniture</p>
        </div>
    </header>

    <main id="albumContainer" class="album-grid container mx-auto max-w-7xl pb-24"></main>

    <div id="lightbox" class="fixed inset-0 hidden z-[100] flex-col items-center justify-center p-4 backdrop-blur-xl">
        <button onclick="closeLightbox()" class="absolute top-6 right-6 text-white/50 hover:text-amber-500 transition-colors text-4xl">&times;</button>
        
        <div class="flex items-center justify-center gap-4 md:gap-12 w-full max-w-5xl">
            <button onclick="changePhoto(-1)" class="nav-btn hidden md:flex shrink-0">❮</button>
            
            <div class="flex-1 flex flex-col items-center">
                <img id="bigImage" src="" class="max-h-[60vh] md:max-h-[75vh] w-auto rounded-lg shadow-2xl border border-white/10 object-contain transition-all duration-300">
                
                <div class="mt-8 text-center px-4">
                    <p id="caption" class="section-title text-2xl md:text-4xl italic text-amber-500 mb-1"></p>
                    <p id="photoIndex" class="text-slate-500 text-[10px] font-bold tracking-widest uppercase"></p>
                </div>
            </div>

            <button onclick="changePhoto(1)" class="nav-btn hidden md:flex shrink-0">❯</button>
        </div>
        
        <div class="flex gap-10 mt-10 md:hidden">
            <button onclick="changePhoto(-1)" class="nav-btn scale-125">❮</button>
            <button onclick="changePhoto(1)" class="nav-btn scale-125">❯</button>
        </div>
    </div>

    <script>
        const albumContainer = document.getElementById('albumContainer');
        const totalPhotos = 88;
        const images = [];
        const decs = [];

        const groups = [
            { start: 1, end: 10, text: "Awal Perjalanan" },
            { start: 11, end: 25, text: "Workshop Days" },
            { start: 26, end: 50, text: "Classroom Fun" },
            { start: 51, end: 88, text: "Momen Emas" }
        ];

        // Generate Cards
        for (let i = 1; i <= totalPhotos; i++) {
            const imagePath = `kelas3/kelas3 (${i}).jpg`;
            images.push(imagePath);

            const group = groups.find(g => i >= g.start && i <= g.end);
            const description = group ? group.text : `Frame #${i}`;
            decs.push(description);

            const photoCard = document.createElement('div');
            photoCard.className = 'photo-card shadow-lg';
            photoCard.onclick = () => openLightbox(i - 1);
            photoCard.innerHTML = `<img src="${imagePath}" alt="Gallery" loading="lazy">`;
            albumContainer.appendChild(photoCard);
        }

        let currentIndex = 0;

        function openLightbox(index) {
            currentIndex = index;
            const lb = document.getElementById('lightbox');
            lb.classList.remove('hidden');
            lb.classList.add('flex');
            document.body.style.overflow = 'hidden';
            updateDisplay();
        }

        function closeLightbox() {
            const lb = document.getElementById('lightbox');
            lb.classList.add('hidden');
            lb.classList.remove('flex');
            document.body.style.overflow = 'auto';
        }

        function changePhoto(step) {
            currentIndex = (currentIndex + step + images.length) % images.length;
            updateDisplay();
        }

        function updateDisplay() {
            const img = document.getElementById('bigImage');
            img.style.opacity = '0';
            
            setTimeout(() => {
                img.src = images[currentIndex];
                img.style.opacity = '1';
                document.getElementById('caption').innerText = decs[currentIndex];
                document.getElementById('photoIndex').innerText = `Memory ${currentIndex + 1} / ${totalPhotos}`;
            }, 150);
        }

        // Keyboard support
        document.addEventListener('keydown', (e) => {
            if (e.key === "ArrowRight") changePhoto(1);
            if (e.key === "ArrowLeft") changePhoto(-1);
            if (e.key === "Escape") closeLightbox();
        });
    </script>
</body>
</html>
