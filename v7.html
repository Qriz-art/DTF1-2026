<!DOCTYPE html>
<html lang="id" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Golden Memories XI | Angkatan 2025</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600;800&family=Cormorant+Garamond:italic,wght@600&display=swap" rel="stylesheet">
    <style>
        body { 
            font-family: 'Plus Jakarta Sans', sans-serif; 
            background-color: #0a0a0a; 
            color: #f4f4f4;
        }

        /* Glassmorphism Gold Tint */
        .glass-gold {
            background: rgba(255, 191, 0, 0.03);
            backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 191, 0, 0.1);
        }

        /* Album Grid Styling */
        .album-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 25px;
            padding: 2rem;
        }

        .photo-card {
            position: relative;
            aspect-ratio: 1 / 1;
            border-radius: 15px;
            overflow: hidden;
            background: #1a1a1a;
            transition: all 0.6s cubic-bezier(0.23, 1, 0.32, 1);
        }

        .photo-card img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            filter: sepia(20%) brightness(90%);
            transition: all 0.8s ease;
        }

        .photo-card::after {
            content: '';
            position: absolute;
            inset: 0;
            border: 0px solid #fbbf24;
            transition: all 0.4s ease;
            pointer-events: none;
        }

        .photo-card:hover {
            transform: scale(0.98);
            box-shadow: 0 0 30px rgba(251, 191, 36, 0.2);
        }

        .photo-card:hover::after {
            border: 8px solid rgba(251, 191, 36, 0.2);
        }

        .photo-card:hover img {
            filter: sepia(0%) brightness(110%);
            transform: scale(1.1);
        }

        /* Lightbox Custom */
        #lightbox {
            background-color: rgba(5, 5, 5, 0.98);
        }

        .nav-btn {
            background: rgba(251, 191, 36, 0.1);
            color: #fbbf24;
            width: 50px;
            height: 50px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s ease;
            border: 1px solid rgba(251, 191, 36, 0.2);
        }

        .nav-btn:hover {
            background: #fbbf24;
            color: #000;
            transform: translateY(-3px);
        }

        .section-title {
            font-family: 'Cormorant Garamond', serif;
        }
    </style>
</head>
<body class="antialiased">

    <header class="pt-24 pb-12 px-6 relative overflow-hidden">
        <div class="absolute top-0 left-1/2 -translate-x-1/2 w-full h-full bg-[radial-gradient(circle_at_center,_var(--tw-gradient-stops))] from-amber-900/20 via-transparent to-transparent -z-10"></div>

        <div class="container mx-auto text-center">
            <div class="flex justify-center mb-10">
                <a href="index.html" class="group relative flex items-center gap-4 no-underline">
                    <div class="w-10 h-10 flex items-center justify-center rounded-full border border-amber-500/30 group-hover:bg-amber-500 transition-all duration-500">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4 text-amber-500 group-hover:text-black" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7" />
                        </svg>
                    </div>
                    <div class="text-left">
                        <p class="text-[9px] tracking-[0.4em] text-amber-500 font-bold uppercase leading-none mb-1">Previous</p>
                        <p class="text-xs font-bold text-white uppercase tracking-widest">Back to Hub</p>
                    </div>
                </a>
            </div>

            <h1 class="text-5xl md:text-7xl font-light tracking-tighter mb-4">
                MEMORIES <span class="section-title italic text-amber-500 uppercase">2024-2025</span>
            </h1>
            <div class="h-[1px] w-24 bg-amber-500 mx-auto mb-6"></div>
            <p class="text-slate-400 tracking-[0.2em] uppercase text-[10px] font-bold">Class XI • Desain Teknik Furniture</p>
        </div>
    </header>

    <main id="albumContainer" class="album-grid container mx-auto max-w-7xl pb-24"></main>

    <div id="lightbox" class="fixed inset-0 hidden z-[100] flex-col items-center justify-center p-4 backdrop-blur-md">
        <button onclick="closeLightbox()" class="absolute top-8 right-8 text-amber-500 hover:rotate-90 transition-all duration-500 text-5xl font-light">&times;</button>
        
        <div class="flex items-center gap-4 md:gap-12 w-full max-w-6xl">
            <button onclick="changePhoto(-1)" class="nav-btn hidden md:flex">❮</button>
            
            <div class="flex-1 flex flex-col items-center">
                <img id="bigImage" src="" class="max-h-[70vh] w-auto rounded-lg shadow-[0_20px_50px_rgba(0,0,0,0.5)] border border-amber-500/20 transition-all duration-500">
                <div class="mt-10 text-center">
                    <p id="caption" class="section-title text-3xl italic text-amber-500 mb-2"></p>
                    <div class="flex items-center justify-center gap-4">
                        <div class="h-[1px] w-8 bg-amber-500/30"></div>
                        <p id="photoIndex" class="text-slate-500 text-[10px] font-bold tracking-widest uppercase"></p>
                        <div class="h-[1px] w-8 bg-amber-500/30"></div>
                    </div>
                </div>
            </div>

            <button onclick="changePhoto(1)" class="nav-btn hidden md:flex">❯</button>
        </div>
        
        <div class="flex gap-8 mt-12 md:hidden">
            <button onclick="changePhoto(-1)" class="nav-btn">❮</button>
            <button onclick="changePhoto(1)" class="nav-btn">❯</button>
        </div>
    </div>

    <div class="fixed bottom-8 left-8 z-[999]">
        <button onclick="handleMusic()" class="glass-gold p-1.5 pr-5 rounded-full flex items-center gap-3 border border-amber-500/20 hover:bg-amber-500/10 transition-all group">
            <div class="w-8 h-8 rounded-full bg-amber-500 flex items-center justify-center shadow-lg shadow-amber-500/20">
                <span id="playIcon" class="text-[10px] text-black">▶</span>
                <span id="pauseIcon" class="text-[10px] text-black hidden">||</span>
            </div>
            <div class="flex flex-col text-left">
                <span id="musicStatus" class="text-[7px] font-black tracking-[0.2em] uppercase text-amber-500">Off</span>
                <span class="text-[9px] font-bold text-white/80 tracking-tight">XI Ambience</span>
            </div>
        </button>
    </div>

    <audio id="bgMusic" loop><source src="laskar.mp3" type="audio/mpeg"></audio>

    <script>
        const albumContainer = document.getElementById('albumContainer');
        const totalPhotos = 88;
        const images = [];
        const decs = [];

        const groups = [
            { start: 1, end: 10, text: "Awal Perjalanan Kelas XI" },
            { start: 11, end: 25, text: "Workshop & Kreasi Furniture" },
            { start: 26, end: 50, text: "Tawa di Sela Pelajaran" },
            { start: 51, end: 88, text: "Momen Emas 2025" }
        ];

        for (let i = 1; i <= totalPhotos; i++) {
            const imagePath = `kelas3/kelas3 (${i}).jpg`;
            images.push(imagePath);

            const group = groups.find(g => i >= g.start && i <= g.end);
            const description = group ? group.text : `Frame XI - #${i}`;
            decs.push(description);

            const photoCard = document.createElement('div');
            photoCard.className = 'photo-card shadow-xl';
            photoCard.onclick = () => openLightbox(i - 1);
            photoCard.innerHTML = `<img src="${imagePath}" alt="${description}" loading="lazy">`;
            albumContainer.appendChild(photoCard);
        }

        let currentIndex = 0;

        function openLightbox(index) {
            currentIndex = index;
            document.getElementById('lightbox').classList.replace('hidden', 'flex');
            document.body.style.overflow = 'hidden';
            updateDisplay();
        }

        function closeLightbox() {
            document.getElementById('lightbox').classList.replace('flex', 'hidden');
            document.body.style.overflow = 'auto';
        }

        function changePhoto(step) {
            currentIndex = (currentIndex + step + images.length) % images.length;
            updateDisplay();
        }

        function updateDisplay() {
            const img = document.getElementById('bigImage');
            img.style.transform = 'scale(0.95)';
            img.style.opacity = '0';
            
            setTimeout(() => {
                img.src = images[currentIndex];
                img.style.transform = 'scale(1)';
                img.style.opacity = '1';
                document.getElementById('caption').innerText = decs[currentIndex];
                document.getElementById('photoIndex').innerText = `Memory ${currentIndex + 1} / ${totalPhotos}`;
            }, 200);
        }

        const audio = document.getElementById('bgMusic');
        audio.volume = 0.3;

        function handleMusic() {
            const playIco = document.getElementById('playIcon');
            const pauseIco = document.getElementById('pauseIcon');
            const status = document.getElementById('musicStatus');

            if (audio.paused) {
                audio.play();
                playIco.classList.add('hidden');
                pauseIco.classList.remove('hidden');
                status.innerText = "Playing";
            } else {
                audio.pause();
                playIco.classList.remove('hidden');
                pauseIco.classList.add('hidden');
                status.innerText = "Off";
            }
        }

        document.addEventListener('keydown', (e) => {
            if (e.key === "ArrowRight") changePhoto(1);
            if (e.key === "ArrowLeft") changePhoto(-1);
            if (e.key === "Escape") closeLightbox();
        });
    </script>
</body>
</html>
