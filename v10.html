<!DOCTYPE html>
<html lang="id" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>THE FINAL LEGACY | 2026</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@200;400;800&family=Playfair+Display:ital,wght@1,900&family=Inter:wght@900&display=swap" rel="stylesheet">
    <style>
        body { 
            background-color: #050505; 
            color: #ffffff; 
            font-family: 'Plus Jakarta Sans', sans-serif;
            overflow-x: hidden;
        }

        .particles {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: radial-gradient(circle at 50% 50%, rgba(255,215,0,0.02) 0%, transparent 80%);
            pointer-events: none; z-index: 1;
        }

        .nav-header {
            position: absolute;
            top: 0; left: 0; width: 100%;
            z-index: 100;
            padding: 1.5rem 1rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        @media (min-width: 768px) { .nav-header { padding: 2.5rem 3rem; } }

        /* --- GRID OPTIMIZATION (2 Kolom di HP) --- */
        .album-grid {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr)); /* Default 2 kolom untuk HP */
            gap: 12px; /* Jarak lebih rapat di mobile agar rapi */
            padding: 2rem 1rem;
        }
        @media (min-width: 768px) { 
            .album-grid { 
                grid-template-columns: repeat(2, minmax(0, 1fr)); 
                gap: 30px; 
                padding: 4rem 2rem;
            } 
        }
        @media (min-width: 1280px) { 
            .album-grid { grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 50px; } 
        }

        .photo-card {
            position: relative;
            background: #000;
            padding: 6px;
            border: 1px solid rgba(255, 255, 255, 0.03);
            transition: all 0.8s cubic-bezier(0.2, 1, 0.2, 1);
            cursor: pointer;
        }
        @media (min-width: 768px) { .photo-card { padding: 12px; } }

        .photo-card img {
            width: 100%;
            aspect-ratio: 3/4;
            object-fit: cover;
            filter: grayscale(0.6) brightness(0.7);
            transition: all 1s ease;
        }

        .photo-number {
            position: absolute;
            top: -5px; left: -5px;
            font-family: 'Inter', sans-serif;
            font-size: 2rem; font-weight: 900;
            color: rgba(255, 255, 255, 0.03);
            z-index: 0; pointer-events: none;
        }
        @media (min-width: 768px) { .photo-number { font-size: 5rem; top: -20px; left: -20px; } }

        .photo-card:hover {
            border-color: rgba(212, 175, 55, 0.3);
            transform: translateY(-10px) rotate(1deg);
            z-index: 10;
        }

        .photo-card:hover img {
            filter: grayscale(0) brightness(1);
            transform: scale(1.03);
        }

        .text-reveal {
            font-family: 'Inter', sans-serif;
            font-size: clamp(3rem, 15vw, 12rem);
            line-height: 0.8; letter-spacing: -0.05em;
            color: transparent;
            -webkit-text-stroke: 1px rgba(255,255,255,0.1);
            background: linear-gradient(to bottom, #fff 50%, #d4af37 50%);
            background-size: 100% 200%;
            background-clip: text; -webkit-background-clip: text;
            transition: background-position 1s ease;
        }
        header:hover .text-reveal { background-position: 0 -100%; }

        #lightbox { background: rgba(0,0,0,0.98); backdrop-filter: blur(40px); }
    </style>
</head>
<body class="antialiased relative">

    <div class="particles"></div>

    <nav class="nav-header mix-blend-difference">
        <a href="index.html" class="group relative flex items-center no-underline">
            <div class="relative w-12 h-12 md:w-20 md:h-20 flex items-center justify-center">
                <div class="absolute inset-0 border border-white/10 rounded-full group-hover:scale-150 transition-all duration-1000"></div>
                <div class="relative w-8 h-8 md:w-12 md:h-12 bg-white rounded-full flex items-center justify-center transition-all duration-500 group-hover:bg-amber-500">
                    <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4 md:w-5 md:h-5 text-black" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M15 19l-7-7 7-7" />
                    </svg>
                </div>
            </div>
            <div class="ml-4 flex flex-col hidden sm:flex">
                <span class="text-[8px] font-black tracking-widest text-amber-500 uppercase">Return to</span>
                <span class="text-sm font-black text-white uppercase italic">GALLERY</span>
            </div>
        </a>

        <div class="flex items-center gap-4 md:gap-6 opacity-60">
            <div class="text-right">
                <p class="text-[7px] md:text-[8px] font-black tracking-widest text-white/50 uppercase">Archive Mode</p>
                <p class="text-[9px] md:text-[10px] font-bold text-amber-500 tracking-widest uppercase">XII DTF 1</p>
            </div>
            <div class="w-[1px] h-8 md:h-10 bg-white/20"></div>
            <span class="text-lg md:text-xl font-black italic">26</span>
        </div>
    </nav>

    <header class="relative min-h-[60vh] md:min-h-screen flex flex-col items-center justify-center text-center px-6 pt-20">
        <div class="z-10">
            <p class="text-[10px] md:text-xs font-bold tracking-[0.5em] md:tracking-[0.8em] uppercase text-amber-500 mb-4 md:mb-8 animate-pulse">The Journey Ends Here</p>
            <h1 class="text-reveal uppercase">LEGACY</h1>
            <h2 class="font-serif italic text-2xl md:text-6xl text-white mt-2 md:mt-[-30px] z-20 relative">Two Thousand <span class="text-amber-500">Twenty Six</span></h2>
        </div>
    </header>

    <main id="albumContainer" class="album-grid container mx-auto max-w-[1600px]"></main>

    <div id="lightbox" class="fixed inset-0 hidden z-[200] flex-col items-center justify-center p-4 transition-all duration-700 opacity-0">
        <button onclick="closeLightbox()" class="absolute top-6 right-6 text-white/50 hover:text-white text-4xl font-thin">&times;</button>
        <div class="flex items-center justify-between w-full max-w-7xl">
            <button onclick="changePhoto(-1)" class="text-white/10 hover:text-white transition-all text-4xl md:text-6xl p-4">&lsaquo;</button>
            <div class="flex flex-col items-center max-w-[85%]">
                <img id="bigImage" src="" class="max-h-[70vh] w-auto shadow-2xl border border-white/5 transition-all duration-700">
                <div class="mt-8 text-center">
                    <p id="caption" class="font-serif italic text-2xl md:text-4xl text-white mb-2"></p>
                    <p id="photoIndex" class="text-amber-500/50 text-[9px] font-bold tracking-[0.5em] uppercase"></p>
                </div>
            </div>
            <button onclick="changePhoto(1)" class="text-white/10 hover:text-white transition-all text-4xl md:text-6xl p-4">&rsaquo;</button>
        </div>
    </div>

    <script>
        const albumContainer = document.getElementById('albumContainer');
const images = [];
let currentIndex = 0;
const lightbox = document.getElementById('lightbox');

// Fungsi Otomatis Scan Foto
async function loadGallery() {
    let i = 1;
    let keepChecking = true;

    while (keepChecking) {
        // Daftar format yang akan dicek satu per satu
        const extensions = ['jpg', 'jpeg'];
        let foundPath = null;

        for (let ext of extensions) {
            const testPath = `kelas3 (${i}).${ext}`;
            try {
                // Method HEAD hanya cek header file, lebih cepat daripada download
                const response = await fetch(testPath, { method: 'HEAD' });
                if (response.ok) {
                    foundPath = testPath;
                    break; // Jika ketemu, berhenti cek ekstensi lain untuk angka ini
                }
            } catch (error) {
                // Abaikan error koneksi
            }
        }

        if (foundPath) {
            images.push(foundPath);
            
            const formattedNum = i < 10 ? `0${i}` : i;
            const div = document.createElement('div');
            div.className = 'photo-card group';
            
            const photoIndex = i - 1; 
            div.onclick = () => openLightbox(photoIndex);
            
            div.innerHTML = `
                <div class="photo-number">${formattedNum}</div>
                <div class="overflow-hidden relative z-10">
                    <img src="${foundPath}" loading="lazy" alt="Gallery ${i}">
                    <div class="absolute inset-0 bg-gradient-to-t from-black/80 via-transparent to-transparent opacity-80"></div>
                </div>
                <div class="absolute bottom-3 left-3 md:bottom-8 md:left-8 z-20 opacity-100 md:opacity-0 md:group-hover:opacity-100 transform transition-all duration-700">
                    <p class="text-amber-500 text-[7px] md:text-[9px] font-black tracking-widest uppercase mb-1">Archive 26</p>
                    <h3 class="text-white text-[10px] md:text-xl font-bold tracking-tighter leading-none uppercase">Frame ${formattedNum}</h3>
                </div>
            `;
            albumContainer.appendChild(div);
            i++;
        } else {
            // Jika kedua ekstensi tidak ditemukan, hentikan pencarian
            keepChecking = false;
        }

        // Batas aman agar browser tidak crash jika file sangat banyak
        if (i > 1000) break;
    }
}

// Jalankan fungsi
loadGallery();

function openLightbox(index) {
    currentIndex = index;
    lightbox.classList.remove('hidden');
    setTimeout(() => { 
        lightbox.classList.add('flex'); 
        lightbox.style.opacity = '1'; 
    }, 10);
    document.body.style.overflow = 'hidden';
    updateDisplay();
}

function closeLightbox() {
    lightbox.style.opacity = '0';
    setTimeout(() => { 
        lightbox.classList.add('hidden'); 
        lightbox.classList.remove('flex'); 
    }, 700);
    document.body.style.overflow = 'auto';
}

function changePhoto(step) {
    if (images.length === 0) return;
    currentIndex = (currentIndex + step + images.length) % images.length;
    updateDisplay();
}

function updateDisplay() {
    const img = document.getElementById('bigImage');
    const totalPhotos = images.length; // Hitung jumlah foto terbaru
    
    img.style.filter = 'brightness(0) blur(10px)';
    
    setTimeout(() => {
        img.src = images[currentIndex];
        img.style.filter = 'brightness(1) blur(0)';
        document.getElementById('caption').innerText = `Memento #${currentIndex + 1}`;
        document.getElementById('photoIndex').innerText = `${currentIndex + 1} / ${totalPhotos}`;
    }, 300);
}

// Keyboard Navigation
document.addEventListener('keydown', (e) => {
    if (e.key === "ArrowRight") changePhoto(1);
    if (e.key === "ArrowLeft") changePhoto(-1);
    if (e.key === "Escape") closeLightbox();
});
    </script>
</body>
</html>
