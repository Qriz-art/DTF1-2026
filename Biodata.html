    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600;800&family=Dancing+Script:wght@700&family=Playfair+Display:italic,wght@700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #020617; color: #f8fafc; overflow-x: hidden; }
        
        .glass { 
            background: rgba(255, 255, 255, 0.02); 
            backdrop-filter: blur(15px); 
            border: 1px solid rgba(255, 255, 255, 0.05); 
        }

        /* Kartu Khusus Restu (Gold Legacy) */
        .gold-legacy {
            background: linear-gradient(145deg, rgba(251, 191, 36, 0.05), rgba(0, 0, 0, 0.2));
            border: 1px solid rgba(251, 191, 36, 0.3) !important;
            box-shadow: 0 0 20px rgba(251, 191, 36, 0.1);
        }
        
        @media (min-width: 1024px) {
            .glass-hover:hover {
                background: rgba(255, 255, 255, 0.05);
                border: 1px solid rgba(59, 130, 246, 0.3);
                transform: translateY(-8px);
            }
            .gold-legacy:hover {
                border: 1px solid rgba(251, 191, 36, 0.6) !important;
                box-shadow: 0 0 30px rgba(251, 191, 36, 0.2);
            }
        }

        /* --- ANIMASI DRAMATIS --- */
        .students-wrapper {
            display: inline-flex;
            align-items: center;
            position: relative;
            max-width: 180px;
            transition: all 0.8s cubic-bezier(0.4, 0, 0.2, 1);
            vertical-align: middle;
        }

        @media (min-width: 768px) { .students-wrapper { max-width: 500px; } }

        .strike-line {
            position: absolute;
            left: 0;
            top: 55%;
            width: 0;
            height: 3px;
            background: #3b82f6;
            border-radius: 10px;
            transition: width 0.4s ease-out;
            z-index: 10;
        }

        @media (min-width: 768px) { .strike-line { height: 6px; } }
        .line-active { width: 100% !important; }

        @keyframes fallAndFade {
            0% { transform: translateY(0) rotate(0deg); opacity: 1; }
            100% { transform: translateY(50px) rotate(10deg); opacity: 0; filter: blur(10px); }
        }
        .falling { animation: fallAndFade 0.8s forwards ease-in; }

        .shrink-container { max-width: 0 !important; opacity: 0; overflow: hidden; }

        @keyframes wiggle {
            0%, 100% { transform: rotate(0deg); }
            25% { transform: rotate(2deg); }
            75% { transform: rotate(-2deg); }
        }
        .wiggle-effect { animation: wiggle 0.1s infinite; }

        .animate-modal { animation: modalShow 0.4s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
        @keyframes modalShow { from { opacity: 0; transform: scale(0.95); } to { opacity: 1; transform: scale(1); } }
    </style>
</head>

        const container = document.getElementById('studentContainer');
        students.forEach(student => {

            const card = `

                    </div>
                </div>
            `;
            container.innerHTML += card;
        });

        // MODAL LOGIC
        function openBio(nama, foto, kelas, hobi, quotes, ig) {
            document.getElementById('mNama').innerText = nama;
            document.getElementById('mFoto').src = foto;
            document.getElementById('mKelas').innerText = kelas;
            document.getElementById('mHobi').innerText = hobi;
            document.getElementById('mQuotes').innerText = `"${quotes}"`;
            document.getElementById('mIG').href = `https://instagram.com/${ig}`;

            const modal = document.getElementById('bioModal');
            modal.classList.remove('hidden');
            modal.classList.add('flex');
            document.body.style.overflow = 'hidden';
        }

        function closeBio() {
            const modal = document.getElementById('bioModal');
            modal.classList.add('hidden');
            modal.classList.remove('flex');
            document.body.style.overflow = 'auto';
        }

        // HEADER ANIMATION
        function runPremiumAnimation() {
            const strikeText = document.getElementById('strikeText');
            const strikeLine = document.getElementById('strikeLine');
            const wrapper = document.getElementById('wrapper');

            setTimeout(() => { if(strikeLine) strikeLine.classList.add('line-active'); }, 1000);
            setTimeout(() => { 
                if(strikeText) strikeText.classList.add('wiggle-effect'); 
                if(strikeLine) strikeLine.classList.add('wiggle-effect'); 
            }, 1400);
            setTimeout(() => { 
                if(strikeText) { strikeText.classList.remove('wiggle-effect'); strikeText.classList.add('falling'); }
                if(strikeLine) { strikeLine.classList.remove('wiggle-effect'); strikeLine.classList.add('falling'); }
            }, 2000);
            setTimeout(() => { if(wrapper) wrapper.classList.add('shrink-container'); }, 2200);
            setTimeout(() => { 
                if(wrapper) wrapper.classList.remove('shrink-container');
                if(strikeText) strikeText.classList.remove('falling');
                if(strikeLine) { strikeLine.classList.remove('falling'); strikeLine.classList.remove('line-active'); }
                setTimeout(runPremiumAnimation, 1000); 
            }, 5500);
        }

        window.onload = runPremiumAnimation;
        window.onclick = e => { if(e.target == document.getElementById('bioModal')) closeBio(); }
    </script>
</body>
