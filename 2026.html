<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Album kelas XII | Angkatan 2026</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .lightbox-active { overflow: hidden; }
        .album-grid {
            display: grid;
            grid-template-columns: repeat(1, minmax(0, 1fr));
            gap: 1.5rem;
            padding: 2rem;
        }
        @media (min-width: 768px) {
            .album-grid { grid-template-columns: repeat(3, minmax(0, 1fr)); }
        }
        .photo-card {
            aspect-ratio: 1 / 1;
            width: 100%;
            overflow: hidden;
            border-radius: 0.75rem;
            box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1);
            cursor: pointer;
            background-color: #e5e7eb; /* Loading placeholder */
        }
        .photo-card img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.5s ease;
        }
        .photo-card:hover img { transform: scale(1.1); }
    </style>
</head>
<body class="bg-gray-100 font-sans">

    <header class="bg-white shadow-md py-8 px-6 mb-10">
        <div class="container mx-auto">
            
           <div class="relative pt-12 pb-10 px-8 max-w-7xl mx-auto">
    
    <div class="mb-10">
        <a href="index.html" class="group inline-flex items-center gap-5 no-underline">
            
            <div class="relative w-8 h-6 flex flex-col justify-between overflow-visible">
                <span class="h-[3px] w-full bg-gray-900 rounded-full transition-all duration-300 transform group-hover:rotate-45 group-hover:translate-y-[10.5px]"></span>
                
                <span class="h-[3px] w-full bg-gray-900 rounded-full transition-all duration-300 transform origin-right group-hover:scale-x-0 group-hover:opacity-0"></span>

                <span class="h-[3px] w-full bg-gray-900 rounded-full transition-all duration-300 transform group-hover:-rotate-45 group-hover:-translate-y-[10.5px]"></span>
            </div>

            <div class="flex flex-col relative">
                <span class="text-sm font-black tracking-[0.15em] text-gray-900 uppercase transition-all duration-300 group-hover:text-yellow-500">
                    Back to Album
                </span>
                
                <div class="h-[3px] w-0 bg-black transition-all duration-500 ease-out 
                            group-hover:w-full delay-150 group-hover:delay-300"></div>
            </div>
        </a>
    </div>

    <div class="relative">
        <h1 class="text-4xl md:text-5xl font-black text-gray-800 tracking-tight uppercase">
            Album Kelas <span class="text-blue-600 italic">XII</span>
        </h1>
        
    </div>
</div>

    </header>

    <div id="albumContainer" class="album-grid container mx-auto"></div>

    <div id="lightbox" class="fixed inset-0 bg-black/95 hidden z-[100] flex-col items-center justify-center p-4">
        <button onclick="closeLightbox()" class="absolute top-5 right-5 text-white text-5xl z-[110]">&times;</button>
        
        <button onclick="changePhoto(-1)" class="absolute left-4 text-white text-6xl hover:text-blue-400 z-[110]">&lsaquo;</button>
        <button onclick="changePhoto(1)" class="absolute right-4 text-white text-6xl hover:text-blue-400 z-[110]">&rsaquo;</button>

        <div class="max-w-5xl w-full flex flex-col items-center">
            <img id="bigImage" src="" class="max-h-[80vh] w-auto rounded-lg shadow-2xl transition-all duration-300">
            <p id="caption" class="text-white mt-6 text-xl font-light tracking-wide text-center bg-black/50 px-6 py-2 rounded-full"></p>
        </div>
    </div>

    <audio id="bgMusic" loop>
        <source src="laskar.mp3" type="audio/mpeg">
    </audio>

    <div class="fixed bottom-6 right-6 z-[999]">
        <button onclick="handleMusic()" id="musicBtn" class="flex items-center gap-3 bg-white/80 backdrop-blur-sm px-6 py-3 rounded-full shadow-xl border border-blue-200 transition-all active:scale-90 group">
            <div class="bg-black p-2 rounded-full text-white group-hover:bg-purple-600">
                <svg id="iconPlay" xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" viewBox="0 0 20 20" fill="currentColor">
                    <path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zM9.555 7.168A1 1 0 008 8v4a1 1 0 001.555.832l3-2a1 1 0 000-1.664l-3-2z" clip-rule="evenodd" />
                </svg>
                <svg id="iconPause" xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 hidden" viewBox="0 0 20 20" fill="currentColor">
                    <path fill-rule="evenodd" d="M18 10a8 8 0 11-16 0 8 8 0 0116 0zM7 8a1 1 0 012 0v4a1 1 0 11-2 0V8zm5-1a1 1 0 00-1 1v4a1 1 0 102 0V8a1 1 0 00-1-1z" clip-rule="evenodd" />
                </svg>
            </div>
            <span id="musicStatus" class="text-black font-bold text-sm tracking-wide">PUTAR LAGU</span>
        </button>
    </div>

    <script>
        const albumContainer = document.getElementById('albumContainer');
        const totalPhotos = 119;
        const images = [];
        const decs = [];

        const customDescriptions = {
            1: "Pagi ceria di hari pertama study tour",
            5: "Bersama sahabat di objek wisata A",
            12: "Makan siang bersama, seru sekali!",
            30: "Pemandangan indah dari ketinggian",
            55: "Saat-saat bermain di pantai",
            70: "Foto kenangan sebelum pulang",
            88: "Momen penutup yang haru"
        };

        // LOOP TUNGGAL (Sekaligus isi array dan HTML)
        for (let i = 1; i <= totalPhotos; i++) {
            const imagePath = `kelas3 (${i}).jpg`;
            images.push(imagePath);

            const description = customDescriptions[i] || `Momen indah kelas 3, foto ke-${i}`;
            decs.push(description);

            const photoCard = document.createElement('div');
            photoCard.className = 'photo-card';
            photoCard.onclick = () => openLightbox(i - 1);
            photoCard.innerHTML = `<img src="${imagePath}" alt="${description}" loading="lazy">`;
            albumContainer.appendChild(photoCard);
        }

        let currentIndex = 0;

        function openLightbox(index) {
            currentIndex = index;
            const lb = document.getElementById('lightbox');
            lb.classList.replace('hidden', 'flex');
            document.body.classList.add('lightbox-active');
            updateDisplay();
        }

        function closeLightbox() {
            const lb = document.getElementById('lightbox');
            lb.classList.replace('flex', 'hidden');
            document.body.classList.remove('lightbox-active');
        }

        function changePhoto(step) {
            currentIndex = (currentIndex + step + images.length) % images.length;
            updateDisplay();
        }

        function updateDisplay() {
            document.getElementById('bigImage').src = images[currentIndex];
            document.getElementById('caption').innerText = decs[currentIndex];
        }

        // Navigasi Keyboard
        document.addEventListener('keydown', (e) => {
            if (!document.getElementById('lightbox').classList.contains('hidden')) {
                if (e.key === "ArrowRight") changePhoto(1);
                if (e.key === "ArrowLeft") changePhoto(-1);
                if (e.key === "Escape") closeLightbox();
            }
        });

        // Musik
        const lagu = document.getElementById('bgMusic');
        lagu.volume = 0.5;

        function handleMusic() {
            const statusTeks = document.getElementById('musicStatus');
            const iconPlay = document.getElementById('iconPlay');
            const iconPause = document.getElementById('iconPause');

            if (lagu.paused) {
                lagu.play().then(() => {
                    statusTeks.innerText = "JEDA LAGU";
                    iconPlay.classList.add('hidden');
                    iconPause.classList.remove('hidden');
                }).catch(e => console.error("Gagal putar musik:", e));
            } else {
                lagu.pause();
                statusTeks.innerText = "PUTAR LAGU";
                iconPlay.classList.remove('hidden');
                iconPause.classList.add('hidden');
            }
        }
    </script>
</body>
</html>
