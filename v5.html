    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #020617; color: #f8fafc; overflow-x: hidden; }
        
        .glass { 
            background: rgba(255, 255, 255, 0.02); 
            backdrop-filter: blur(15px); 
            border: 1px solid rgba(255, 255, 255, 0.05); 
        }
        
        .glass-hover:hover {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(59, 130, 246, 0.3);
            transform: translateY(-8px);
        }

        /* --- ANIMASI DRAMATIS --- */
        
        /* Wadah Students */
        .students-wrapper {
            display: inline-flex;
            align-items: center;
            position: relative;
            max-width: 500px;
            transition: max-width 0.8s cubic-bezier(0.4, 0, 0.2, 1);
            vertical-align: bottom;
        }

        .strike-line {
            position: absolute;
            left: 0;
            top: 55%;
            width: 0;
            height: 6px;
            background: #3b82f6;
            border-radius: 10px;
            transition: width 0.4s ease-out;
            box-shadow: 0 0 15px rgba(59, 130, 246, 0.5);
            z-index: 10;
        }

        .line-active { width: 100% !important; }

        /* Animasi Runtuh (Jatuh) */
        @keyframes fallAndFade {
            0% { transform: translateY(0) rotate(0deg); opacity: 1; filter: blur(0); }
            100% { transform: translateY(100px) rotate(10deg); opacity: 0; filter: blur(10px); }
        }

        .falling {
            animation: fallAndFade 0.8s forwards ease-in;
        }

        /* Mengecilkan wadah agar tulisan BIODATA ke tengah */
        .shrink-container {
            max-width: 0 !important;
            margin-left: 0 !important;
            opacity: 0;
            transition: max-width 0.8s ease-in-out 0.3s, opacity 0.5s;
        }

        @keyframes wiggle {
            0%, 100% { transform: rotate(0deg); }
            25% { transform: rotate(2deg); }
            75% { transform: rotate(-2deg); }
        }
        .wiggle-effect { animation: wiggle 0.1s infinite; }

        /* Custom UI */
        .animate-modal { animation: modalShow 0.4s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
        @keyframes modalShow { from { opacity: 0; transform: scale(0.9); } to { opacity: 1; transform: scale(1); } }
    </style>

        // FUNGSI MODAL
        function openBio(nama, foto, kelas, hobi, quotes, ig) {
            document.getElementById('mNama').innerText = nama;
            document.getElementById('mFoto').src = foto;

            document.getElementById('mIG').href = `https://instagram.com/${ig}`;

            const modal = document.getElementById('bioModal');
            modal.classList.remove('hidden');
            modal.classList.add('flex');
            document.body.style.overflow = 'hidden';
        }

        function closeBio() {
            const modal = document.getElementById('bioModal');
            modal.classList.add('hidden');
            modal.classList.remove('flex');
            document.body.style.overflow = 'auto';
        }

        // MUSIC LOGIC
const audio = document.getElementById('bgMusic');
const mText = document.getElementById('musicText');

// Atur volume di sini (0.1 sangat pelan, 0.5 sedang, 1.0 keras)
audio.volume = 0.3; 

function handleMusic() {
    if (audio.paused) {
        audio.play();
        mText.innerText = "On";
    } else {
        audio.pause();
        mText.innerText = "Off";
    }
}
        

        window.onclick = e => { if(e.target == document.getElementById('bioModal')) closeBio(); }
         // --- SCRIPT ANIMASI RUNTUH ---
        const strikeText = document.getElementById('strikeText');
        const strikeLine = document.getElementById('strikeLine');
        const wrapper = document.getElementById('wrapper');

        function runPremiumAnimation() {
            // 1. Diam sebentar lalu Coret (Dramatis)
            setTimeout(() => { 
                strikeLine.classList.add('line-active');
            }, 1000);
            
            // 2. Bergetar karena "beban" coretan
            setTimeout(() => { 
                strikeText.classList.add('wiggle-effect');
                strikeLine.classList.add('wiggle-effect');
            }, 1400);

            // 3. Runtuh kebawah (Falling down)
            setTimeout(() => { 
                strikeText.classList.remove('wiggle-effect');
                strikeLine.classList.remove('wiggle-effect');
                strikeText.classList.add('falling');
                strikeLine.classList.add('falling');
            }, 2000);

            // 4. Shrink Wadah (Biodata geser ke tengah)
            setTimeout(() => { 
                wrapper.classList.add('shrink-container');
            }, 2200);

            // 5. Reset & Ulangi
            setTimeout(() => { 
                wrapper.classList.remove('shrink-container');
                strikeText.classList.remove('falling');
                strikeLine.classList.remove('falling');
                strikeLine.classList.remove('line-active');
                
                setTimeout(runPremiumAnimation, 1000); 
            }, 5500);
        }

        window.onload = runPremiumAnimation;
        window.onclick = e => { if(e.target == document.getElementById('bioModal')) closeBio(); }
